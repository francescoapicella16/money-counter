<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Counter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
    margin: 10px;
}

input {
    padding: 10px;
    width: 80%;
    border-radius: 10px;
    border: none;
    margin-bottom: 10px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
    font-weight: bold;
}

.contanti { background: #22c55e; }
.conto { background: #3b82f6; }
.reset { background: #ef4444; }

</style>
</head>

<body>

<h1>💰 Money Counter</h1>

<input type="number" id="importo" placeholder="Inserisci importo €">

<br>

<button class="contanti" onclick="addContanti()">+ Contanti</button>
<button class="conto" onclick="addConto()">+ Conto</button>

<div class="card">💵 Contanti: € <span id="contanti">0</span></div>
<div class="card">🏦 Conto: € <span id="conto">0</span></div>
<div class="card">📊 Totale: € <span id="totale">0</span></div>

<button class="reset" onclick="resetAll()">Reset</button>

<script>
let contanti = parseFloat(localStorage.getItem("contanti")) || 0;
let conto = parseFloat(localStorage.getItem("conto")) || 0;

function update() {
    document.getElementById("contanti").innerText = contanti.toFixed(2);
    document.getElementById("conto").innerText = conto.toFixed(2);
    document.getElementById("totale").innerText = (contanti + conto).toFixed(2);

    localStorage.setItem("contanti", contanti);
    localStorage.setItem("conto", conto);
}

function addContanti() {
    let val = parseFloat(document.getElementById("importo").value);
    if (!isNaN(val)) {
        contanti += val;
        update();
    }
}

function addConto() {
    let val = parseFloat(document.getElementById("importo").value);
    if (!isNaN(val)) {
        conto += val;
        update();
    }
}

function resetAll() {
    if(confirm("Sei sicuro?") && confirm("Davvero davvero?")) {
        contanti = 0;
        conto = 0;
        update();
    }
}

update();
</script>

</body>
</html>
